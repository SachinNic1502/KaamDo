version: "3.8"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kaamdo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/kaamdo?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_jwt_secret_change_me_in_prod_env
      - JWT_REFRESH_SECRET=production_refresh_secret_change_me_in_prod
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kaamdo-network

  mongo:
    image: mongo:7.0
    container_name: kaamdo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate(); }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kaamdo-network

  redis:
    image: redis:7-alpine
    container_name: kaamdo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - kaamdo-network

  nginx:
    image: nginx:alpine
    container_name: kaamdo-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - kaamdo-network

volumes:
  mongo-data:
  redis-data:

networks:
  kaamdo-network:
    driver: bridge
